<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>碳足迹追踪 · Carbon Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">🌱</span>
          <h1 class="app-title">碳足迹追踪</h1>
          <span class="app-subtitle">Carbon Tracker</span>
        </div>
        <p class="app-tagline">记录每一次排放，守护我们的地球</p>
      </div>
    </header>

    <main class="main-content">
      <div class="content-grid">
        <section class="left-panel">
          <div class="card form-card">
            <h2 class="card-title">
              <span class="title-icon">📝</span>
              记录碳排放
            </h2>
            <form id="carbonForm" class="carbon-form">
              <div class="form-group">
                <label for="category">排放类别</label>
                <select id="category" name="category" required>
                  <option value="">请选择类别</option>
                  <option value="交通">🚗 交通出行</option>
                  <option value="饮食">🍽️ 饮食消费</option>
                  <option value="能源">⚡ 能源使用</option>
                  <option value="购物">🛒 购物消费</option>
                  <option value="其他">📦 其他</option>
                </select>
              </div>

              <div class="form-group">
                <label for="action">具体行为</label>
                <input type="text" id="action" name="action" required 
                       placeholder="如：开车上班20km / 点外卖一份" autocomplete="off">
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="emission">碳排放量 (kg CO₂)</label>
                  <input type="number" id="emission" name="emission" 
                         min="0.01" max="1000" step="0.01" value="1" required>
                </div>
                <div class="form-group">
                  <label for="date">日期</label>
                  <input type="date" id="date" name="date" required>
                </div>
              </div>

              <button type="submit" class="submit-btn">
                <span class="btn-icon">💾</span>
                保存记录
              </button>
            </form>
          </div>

          <div class="card stats-card">
            <h2 class="card-title">
              <span class="title-icon">📊</span>
              本月统计
            </h2>
            <div class="stats-grid">
              <div class="stat-item">
                <div class="stat-value" id="monthlyTotal">0</div>
                <div class="stat-label">总排放 (kg CO₂)</div>
              </div>
              <div class="stat-item">
                <div class="stat-value" id="dailyAverage">0</div>
                <div class="stat-label">日均排放 (kg)</div>
              </div>
            </div>
            
            <div class="comparison-section">
              <div class="comparison-header">
                <span class="comparison-title">🌍 与全国人均对比</span>
                <span class="comparison-reference">全国人均日排放: 19.2 kg</span>
              </div>
              <div class="comparison-bar">
                <div class="comparison-fill national">
                  <span class="bar-label">全国人均</span>
                </div>
                <div class="comparison-fill personal" id="personalBar">
                  <span class="bar-label">我的日均</span>
                </div>
              </div>
              <div class="comparison-result" id="comparisonResult">
                暂无数据
              </div>
            </div>
          </div>
        </section>

        <section class="right-panel">
          <div class="card chart-card">
            <h2 class="card-title">
              <span class="title-icon">📈</span>
              最近 30 天排放趋势
            </h2>
            <div class="chart-container">
              <canvas id="carbonChart"></canvas>
              <div class="empty-chart" id="emptyChart">
                <p>暂无记录</p>
                <p class="empty-hint">保存第一条记录后将显示趋势图</p>
              </div>
            </div>
            <div class="chart-legend" id="chartLegend"></div>
          </div>

          <div class="card history-card">
            <div class="history-header">
              <h2 class="card-title">
                <span class="title-icon">📚</span>
                排放记录
                <span class="record-count" id="recordCount">0</span>
              </h2>
            </div>
            <div class="history-list" id="historyList">
              <div class="empty-state">
                <div class="empty-icon">🌿</div>
                <p>还没有碳排放记录</p>
                <p class="empty-hint">填写左侧表单开始记录你的碳足迹</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
